snippets:
  - name: "[nbe] edit note"
    keyword: nbe
    snippet: nb edit

  - name: "[nbl] list notes"
    keyword: nbl
    snippet: nb ls --limit 20

  - name: "[nbla] list all notes"
    keyword: nbla
    snippet: nb ls --all

  - name: "[nbg] search notes"
    keyword: nbg
    snippet: rg "{{keyword}}" "$(nb notebooks current --path)"

completions:
  - name: nb edit
    patterns:
      - "^nb e( .*)? $"
      - "^nb edit( .*)? $"
    sourceCommand: "nb ls --no-color | grep -E '^\\[[0-9]+\\]'"
    options:
      --ansi: true
      --prompt: "'nb edit >'"
      --preview: "echo {} | sed -E 's/^\\[([0-9]+)\\].*/\\1/' | xargs nb show"
    callback: "sed -E 's/^\\[([0-9]+)\\].*/\\1/'"
  - name: nb subcommands
    patterns:
      - ^\s*nb\s*$
      - ^\s*nb\s+help\s*$
    sourceCommand: nb subcommands
    options:
      --prompt: "'nb subcommand >'"
